name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'sudo-yogi/sustainomics'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Missing secret RAILWAY_TOKEN."
            exit 1
          fi
          railway up \
            --service web \
            --environment production \
            --project c44febb1-a9ae-4984-bd54-4817e910c186 \
            --ci \
            --message "gha ${GITHUB_SHA::7}"

      - name: Smoke test public site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-https://thesustainomics.com}"
          echo "Waiting for $SITE_URL ..."
          OK=""
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              OK=1
              echo "Homepage OK ($CODE)"
              break
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 10
          done
          if [ -z "$OK" ]; then
            echo "Smoke test failed: homepage not healthy at $SITE_URL"
            exit 1
          fi
